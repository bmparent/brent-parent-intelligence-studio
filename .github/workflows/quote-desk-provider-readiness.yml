name: Quote Desk provider readiness
on:
  push:
    branches: [codex/quote-desk-launch-20261005]
    paths:
      - 'scripts/quote-desk-provider-readiness.mjs'
      - '.github/workflows/quote-desk-provider-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect the existing credential's read access without changing providers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUOTE_READINESS_RECEIPT: ${{ runner.temp }}/quote-desk-provider-readiness.json
        run: node scripts/quote-desk-provider-readiness.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quote-desk-provider-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/quote-desk-provider-readiness.json
          retention-days: 14
