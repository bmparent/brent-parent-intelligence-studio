name: Quote Desk candidate
on:
  pull_request:
    paths:
      - 'apps/quote-desk/**'
      - 'docs/revenue/**'
      - '.github/workflows/quote-desk.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quote-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/quote-desk/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
