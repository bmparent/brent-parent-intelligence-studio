name: Read-only canonical access diagnostic
on:
  push:
    branches: [codex/indexing-access-diagnostics-20261015]
    paths:
      - 'scripts/diagnose-indexing-access.mjs'
      - '.github/workflows/indexing-access-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install an isolated browser client
        run: |
          npm install --prefix "$RUNNER_TEMP/indexing-browser" --no-save --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/indexing-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Collect bounded public document response evidence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/indexing-browser/node_modules/playwright
          INDEXING_ACCESS_RECEIPT: ${{ runner.temp }}/indexing-access-diagnostic.json
        run: node scripts/diagnose-indexing-access.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexing-access-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/indexing-access-diagnostic.json
          retention-days: 30
