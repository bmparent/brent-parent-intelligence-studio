name: Works account paired contract
on:
  pull_request:
permissions:
  contents: read
jobs:
  exact-pair:
    if: github.head_ref == 'release/works-playground-20261019' || github.head_ref == 'repair/account-acceptance-20261019' || github.head_ref == 'fix/playground-saving-account-20261020' || github.head_ref == 'codex/playground-release-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compare all registered source files with the exact integrated backend
        env:
          SITE_REVISION: ${{ github.sha }}
          BACKEND_REVISION: 49a53b2ea61f46d8a6ba61ec350c3a5c4d1d9eec
        run: |
          git init "$RUNNER_TEMP/works-account-backend"
          git -C "$RUNNER_TEMP/works-account-backend" fetch --depth=1 https://github.com/bmparent/eidos.git "$BACKEND_REVISION"
          git -C "$RUNNER_TEMP/works-account-backend" checkout --detach FETCH_HEAD
          node scripts/verify-paired-contract.mjs "$RUNNER_TEMP/works-account-backend/apps/sentinel-lab" "$RUNNER_TEMP/works-account-contract.json"
          node scripts/export-playground-delivery.mjs "$RUNNER_TEMP/works-account-backend/apps/sentinel-lab"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: works-account-contract-${{ github.sha }}
          path: ${{ runner.temp }}/works-account-contract.json
          if-no-files-found: warn
