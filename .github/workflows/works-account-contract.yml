name: Works account paired contract
on:
  pull_request:
permissions:
  contents: read
jobs:
  exact-pair:
    if: github.head_ref == 'repair/account-acceptance-20261019'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare all registered source files with the exact recovered backend
        env:
          SITE_REVISION: ${{ github.sha }}
          BACKEND_REVISION: bc47de2c6eabe90c204a12643b88161a98a801d4
        run: |
          git init "$RUNNER_TEMP/works-account-backend"
          git -C "$RUNNER_TEMP/works-account-backend" fetch --depth=1 https://github.com/bmparent/eidos.git "$BACKEND_REVISION"
          git -C "$RUNNER_TEMP/works-account-backend" checkout --detach FETCH_HEAD
          node scripts/verify-paired-contract.mjs "$RUNNER_TEMP/works-account-backend/apps/sentinel-lab" "$RUNNER_TEMP/works-account-contract.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: works-account-contract-${{ github.sha }}
          path: ${{ runner.temp }}/works-account-contract.json
          if-no-files-found: warn
