name: Playground editor release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run playground:glass
      - name: Local editing, export and server/client cloud boundary tests
        run: node --import tsx --test scripts/test-playground-composition.ts scripts/test-playground-composition-integration.ts scripts/test-playground-media.ts scripts/test-playground-structure.ts scripts/test-playground-workspace.ts scripts/test-playground-editor-release.ts
      - run: npm run build
      - name: Install isolated browser test tools (no repository dependency changes)
        run: |
          npm install --prefix "$RUNNER_TEMP/pg-browser" --no-save --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/pg-browser/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Actual React editor acceptance in three engines and two widths
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pg-browser/node_modules/playwright
          PG_EVIDENCE_DIR: ${{ runner.temp }}/pg-evidence
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >"$RUNNER_TEMP/pg-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/playground/ >/dev/null && break || sleep 1; done
          node scripts/verify-playground-editor-browser.mjs
      - name: Retain browser evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-editor-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pg-evidence
            ${{ runner.temp }}/pg-preview.log
          if-no-files-found: warn
          retention-days: 14
