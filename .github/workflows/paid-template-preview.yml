name: Paid template TEST candidate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paid-template-test-candidate
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/paid-templates-20261010' || github.event.pull_request.head.ref == 'codex/paid-templates-20261010' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:templates
      - run: npm run test:platform
      - run: npm run build
      - run: npm run verify:prerender && npm run verify:editorial && npm run verify:templates
      - run: npm run validate:insights -- --skip-source-fetch && npm run validate:insights:dist && npm run verify:urls
      - run: npm run build:functions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser test tooling on the runner
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Verify the built candidate in three engines
        run: |
          python -m http.server 5193 --bind 127.0.0.1 --directory dist > /tmp/template-preview-http.log 2>&1 &
          python scripts/verify-template-browser.py --base http://127.0.0.1:5193 --out artifacts/templates/browser-ci
      - name: Configure only the isolated candidate project
        run: node scripts/configure-template-preview.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EIDOS_TEMPLATES_PLATFORM_URL: ${{ secrets.EIDOS_TEMPLATES_PLATFORM_URL }}
          EIDOS_TEMPLATES_PLATFORM_TOKEN: ${{ secrets.EIDOS_TEMPLATES_PLATFORM_TOKEN }}
          EIDOS_TEMPLATES_PREVIEW_BYPASS: ${{ secrets.EIDOS_TEMPLATES_PREVIEW_BYPASS }}
          EIDOS_TEMPLATES_BACKEND_SHA: ${{ secrets.EIDOS_TEMPLATES_BACKEND_SHA }}
      - name: Upload candidate without custom domains
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          npx wrangler pages deploy dist --project-name eidosworks-templates-test-20261010 --branch codex/paid-templates-20261010 --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}" --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-candidate-receipts
          path: |
            artifacts/templates/package-report.json
            artifacts/templates/package-tests.json
            artifacts/templates/release-manifest.json
            artifacts/templates/shop-contract.json
            artifacts/templates/preview-configuration.json
            artifacts/templates/browser-ci/
