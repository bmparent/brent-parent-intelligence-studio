name: Template commerce readiness
on:
  pull_request:
    paths:
      - 'src/components/TemplateShop.tsx'
      - 'functions/**'
      - 'products/templates/**'
      - 'scripts/*template*'
      - '.github/workflows/template-commerce-readiness.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:templates
      - run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Validate static demos, guides and both payment-mode catalog fixtures
        run: |
          python -m http.server 5193 --bind 127.0.0.1 --directory dist > /tmp/template-readiness-http.log 2>&1 &
          python scripts/verify-template-browser.py --base http://127.0.0.1:5193 --out artifacts/templates/browser-readiness-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: template-commerce-readiness
          path: artifacts/templates/browser-readiness-ci/
