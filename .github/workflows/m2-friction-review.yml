name: M2 Friction Review acceptance
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/project-inquiries.ts'
      - 'src/components/FrictionReviewPage.tsx'
      - 'scripts/verify-friction-review-production.mjs'
      - '.github/workflows/m2-friction-review.yml'
permissions:
  contents: read
concurrency:
  group: m2-friction-review-production
  cancel-in-progress: true
jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and run focused platform gates
        run: |
          npm run test:platform
          npm run build
          npm run build:functions
      - name: Install desktop and mobile browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/m2-browser" --no-save --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/m2-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Deploy verified M2 source to existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::M2 production upload blocked because the existing Cloudflare repository secrets are unavailable.'
            exit 1
          fi
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo '::error::A newer main commit exists; refusing to deploy an older M2 build.'
            exit 1
          fi
          npx --no-install wrangler pages deploy dist --project-name=eidosworks --branch=main --commit-hash="$GITHUB_SHA" --commit-message='M2 Friction Review verified release' --commit-dirty=true | tee "$RUNNER_TEMP/m2-deploy.log"
      - name: Verify authoritative production deployment and inquiry runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const { appendFile, readFile, writeFile } = await import('node:fs/promises');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const commit = process.env.GITHUB_SHA;
          const expectedRelease = 'm2-friction-2026-09-15-r1';
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const projectUrl = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/eidosworks`;

          async function readProject() {
            const response = await fetch(projectUrl, {
              headers: { Authorization: `Bearer ${token}` },
              cache: 'no-store',
            });
            assert(response.ok, `Cloudflare project metadata returned ${response.status}.`);
            const body = await response.json();
            assert(body?.success === true && body?.result, 'Cloudflare did not confirm the Pages project.');
            return body.result;
          }

          const metadataDeadline = Date.now() + 180000;
          let deployment = null;
          let lastObserved = { commit: null, status: null, id: null };
          while (Date.now() < metadataDeadline) {
            const project = await readProject();
            assert(project.production_branch === 'main', 'Unexpected Cloudflare production branch.');
            assert(Array.isArray(project.domains) && project.domains.includes('eidos-works.com'), 'The canonical eidos-works.com domain is not attached to the expected Pages project.');
            const candidate = project.canonical_deployment;
            lastObserved = {
              commit: candidate?.deployment_trigger?.metadata?.commit_hash || null,
              status: candidate?.latest_stage?.status || null,
              id: candidate?.id || null,
            };
            if (lastObserved.commit === commit && lastObserved.status === 'success') {
              deployment = candidate;
              break;
            }
            await sleep(3000);
          }
          assert(
            deployment,
            `Cloudflare did not report the exact production commit as successful (expected ${commit}; observed ${lastObserved.commit || 'none'} / ${lastObserved.status || 'none'}).`,
          );

          let deploymentUrl = typeof deployment.url === 'string' ? deployment.url : '';
          if (!/^https:\/\//.test(deploymentUrl)) {
            const deployLog = await readFile(`${process.env.RUNNER_TEMP}/m2-deploy.log`, 'utf8');
            deploymentUrl = deployLog.match(/https:\/\/[a-z0-9-]+\.eidosworks\.pages\.dev/i)?.[0] || '';
          }
          assert(deploymentUrl, 'Could not determine the exact Cloudflare Pages deployment URL.');
          deploymentUrl = deploymentUrl.replace(/\/$/, '');

          const runtimeDeadline = Date.now() + 90000;
          let runtime = null;
          let lastRuntime = 'no response';
          while (Date.now() < runtimeDeadline) {
            try {
              const response = await fetch(`${deploymentUrl}/api/project-inquiries?release=${Date.now()}`, { cache: 'no-store' });
              const contentType = response.headers.get('content-type') || '';
              const text = await response.text();
              lastRuntime = `${response.status} ${contentType} ${text.slice(0, 240)}`;
              if (response.ok && contentType.includes('application/json')) {
                const body = JSON.parse(text);
                if (
                  body?.ok === true &&
                  body?.service === 'project-inquiries' &&
                  body?.release === expectedRelease &&
                  body?.deliveryConfigured === true &&
                  body?.privateMailerConfigured === true
                ) {
                  runtime = body;
                  break;
                }
              }
            } catch (error) {
              lastRuntime = String(error);
            }
            await sleep(3000);
          }
          assert(runtime, `Exact production inquiry runtime did not become ready. Last observation: ${lastRuntime}`);

          await appendFile(process.env.GITHUB_ENV, `M2_FRICTION_BASE_URL=${deploymentUrl}\n`);
          await writeFile(`${process.env.RUNNER_TEMP}/m2-runtime.json`, `${JSON.stringify({
            canonicalDomain: 'https://eidos-works.com',
            canonicalDomainAttached: true,
            canonicalDeploymentId: deployment.id,
            canonicalCommit: commit,
            canonicalStatus: deployment.latest_stage?.status || null,
            deploymentUrl,
            runtimeRelease: runtime.release,
            deliveryConfigured: runtime.deliveryConfigured,
            privateMailerConfigured: runtime.privateMailerConfigured,
            verifiedAt: new Date().toISOString(),
          }, null, 2)}\n`);
          console.log(`Authoritative production commit and inquiry runtime verified at ${deploymentUrl}.`);
          NODE
      # The custom domain can legitimately challenge GitHub-hosted Azure runner IPs.
      # Browser/provider QA therefore runs against the exact successful canonical
      # Pages deployment verified above, not through the zone-level bot challenge.
      - name: Prove Friction Review submission on desktop and mobile
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/m2-browser/node_modules/playwright
          M2_FRICTION_EVIDENCE_DIR: ${{ runner.temp }}/m2-evidence
        run: node scripts/verify-friction-review-production.mjs
      - name: Retain M2 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-friction-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m2-evidence
            ${{ runner.temp }}/m2-deploy.log
            ${{ runner.temp }}/m2-runtime.json
          if-no-files-found: warn
          retention-days: 30
# Focused M2 gate intentionally remains separate from the broader Playground release suite.
