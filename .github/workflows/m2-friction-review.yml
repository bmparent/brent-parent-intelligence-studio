name: M2 Friction Review acceptance
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/project-inquiries.ts'
      - 'src/components/FrictionReviewPage.tsx'
      - 'scripts/verify-friction-review-production.mjs'
      - '.github/workflows/m2-friction-review.yml'
permissions:
  contents: read
concurrency:
  group: m2-friction-review-production
  cancel-in-progress: true
jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and run focused platform gates
        run: |
          npm run test:platform
          npm run build
          npm run build:functions
      - name: Install desktop and mobile browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/m2-browser" --no-save --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/m2-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Deploy verified M2 source to existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::M2 production upload blocked because the existing Cloudflare repository secrets are unavailable.'
            exit 1
          fi
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo '::error::A newer main commit exists; refusing to deploy an older M2 build.'
            exit 1
          fi
          npx --no-install wrangler pages deploy dist --project-name=eidosworks --branch=main --commit-hash="$GITHUB_SHA" --commit-message='M2 Friction Review verified release' --commit-dirty=true | tee "$RUNNER_TEMP/m2-deploy.log"
      - name: Require the canonical domain to mount the new inquiry runtime
        run: |
          node <<'NODE'
          const deadline = Date.now() + 300000;
          const expected = 'm2-friction-2026-09-15-r1';
          let last = 'no response';
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`https://eidos-works.com/api/project-inquiries?release=${Date.now()}`, { cache: 'no-store' });
              const contentType = response.headers.get('content-type') || '';
              const text = await response.text();
              last = `${response.status} ${contentType} ${text.slice(0, 240)}`;
              if (response.ok && contentType.includes('application/json')) {
                const body = JSON.parse(text);
                if (body?.ok === true && body?.service === 'project-inquiries' && body?.release === expected && body?.deliveryConfigured === true && body?.privateMailerConfigured === true) {
                  console.log('Canonical inquiry runtime is current and the private mailer binding is present.');
                  process.exit(0);
                }
              }
            } catch (error) {
              last = String(error);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error(`Canonical inquiry runtime did not become ready. Last observation: ${last}`);
          process.exit(1);
          NODE
      - name: Prove Friction Review submission on desktop and mobile
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/m2-browser/node_modules/playwright
          M2_FRICTION_EVIDENCE_DIR: ${{ runner.temp }}/m2-evidence
          M2_FRICTION_BASE_URL: https://eidos-works.com
        run: node scripts/verify-friction-review-production.mjs
      - name: Retain M2 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-friction-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m2-evidence
            ${{ runner.temp }}/m2-deploy.log
          if-no-files-found: warn
          retention-days: 30
# Focused M2 gate intentionally remains separate from the broader Playground release suite.
