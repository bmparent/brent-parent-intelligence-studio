name: Community follow-ups and cleanup
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['functions/_shared/platform/studioAgents.ts', 'scripts/community-maintenance.mjs', '.github/workflows/community-maintenance.yml']
permissions:
  contents: read
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run maintenance when connected
        env:
          EIDOS_MAINTENANCE_TOKEN: ${{ secrets.EIDOS_MAINTENANCE_TOKEN }}
          EIDOS_PLATFORM_TOKEN: ${{ secrets.EIDOS_PLATFORM_TOKEN }}
        run: node scripts/community-maintenance.mjs
