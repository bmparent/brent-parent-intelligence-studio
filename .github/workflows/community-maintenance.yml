name: Community follow-ups and cleanup
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run maintenance when connected
        env:
          EIDOS_MAINTENANCE_TOKEN: ${{ secrets.EIDOS_MAINTENANCE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$EIDOS_MAINTENANCE_TOKEN" ]; then
            echo "Maintenance is not connected; no request was made."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 45 \
            --request POST \
            --header "Authorization: Bearer $EIDOS_MAINTENANCE_TOKEN" \
            https://eidos-works.com/api/community/maintenance
