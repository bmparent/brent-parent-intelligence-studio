name: Playground connected TEST preview
on:
  pull_request:
    branches: [codex/showcase-20261013]
    paths: ['scripts/deploy-playground-test-preview.mjs', 'scripts/test-playground-test-preview.mjs', 'config/playground-test-preview.json', '.github/workflows/playground-test-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/playground-unified-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/test-playground-test-preview.mjs
  test-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/playground-unified-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/test-playground-test-preview.mjs
      - run: node --import tsx --test scripts/test-relay.ts scripts/test-project-delivery.ts
      - run: npm run lint
      - run: npm run build
      - run: npm run build:functions
      - name: Publish the isolated connected TEST candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EIDOS_PLAYGROUND_PLATFORM_TOKEN: ${{ secrets.EIDOS_PLAYGROUND_PLATFORM_TOKEN }}
          EIDOS_TEMPLATES_PREVIEW_BYPASS: ${{ secrets.EIDOS_TEMPLATES_PREVIEW_BYPASS }}
        run: node scripts/deploy-playground-test-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-connected-test-receipts
          path: artifacts/playground-unified/test-release/
