name: Community studio acceptance
on:
  pull_request:
    paths: ['functions/**', 'src/components/CommunityPages.tsx', 'src/components/MemberProfile.tsx', 'src/styles/members.css', 'src/styles/platform.css', 'public/_redirects', 'public/community-thread.js', 'scripts/verify-public-profiles-browser.mjs', 'scripts/platform-preview.ts', 'scripts/test-community-studio.ts', 'scripts/verify-community-studio-browser.mjs', 'package.json', '.github/workflows/community-studio.yml']
  push:
    branches: [main]
    paths: ['functions/**', 'src/components/CommunityPages.tsx', 'src/components/MemberProfile.tsx', 'src/styles/members.css', 'src/styles/platform.css', 'public/_redirects', 'public/community-thread.js', 'scripts/verify-public-profiles-browser.mjs', 'scripts/platform-preview.ts', 'scripts/test-community-studio.ts', 'scripts/verify-community-studio-browser.mjs', 'package.json', '.github/workflows/community-studio.yml']
permissions:
  contents: read
concurrency:
  group: community-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx --test scripts/test-community-studio.ts
      - name: Build and validate the scoped public community release
        run: |
          npm run lint
          npm run test:platform
          npm run build
          npm run verify:prerender
          npm run verify:editorial
          npm run validate:insights -- --skip-source-fetch
          npm run validate:insights:dist
          npm run verify:urls
          npm run build:functions
      - name: Verify profile routing in the built Pages asset router
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --no-install wrangler pages dev dist --ip 127.0.0.1 --port 8793 --compatibility-date 2026-06-10 --local >"$RUNNER_TEMP/community-pages.log" 2>&1 &
          PROFILE_PAGES_PID=$!
          trap 'kill "$PROFILE_PAGES_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8793/ >/dev/null && break || sleep 1; done
          PROFILE_ROUTE_BASE=http://127.0.0.1:8793 node scripts/verify-public-profile-route.mjs
      - name: Install isolated browser tools
        run: |
          bash scripts/prepare-browser-apt.sh
          npm install --prefix "$RUNNER_TEMP/community-browser" --no-save --no-package-lock playwright@1.58.2
          # GitHub's Ubuntu runner already supplies Chrome's shared libraries.
          # Keep the exact pinned browser and assertions; avoid apt mirror stalls.
          "$RUNNER_TEMP/community-browser/node_modules/.bin/playwright" install chromium
      - name: Immediate human/agent conversation, live replies, and responsive layout
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/community-browser/node_modules/playwright
          COMMUNITY_EVIDENCE_DIR: ${{ runner.temp }}/community-evidence
        run: npm run verify:community-browser
      - name: Public profile ownership, posts, replies, refresh and recovery in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/community-browser/node_modules/playwright
          COMMUNITY_EVIDENCE_DIR: ${{ runner.temp }}/community-evidence
        run: node scripts/verify-public-profiles-browser.mjs
      - name: Retain actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-studio-${{ github.sha }}
          path: ${{ runner.temp }}/community-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Read the existing production Pages relay target without changing it
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/pages/projects/eidosworks`, {
            headers: { authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN }, signal: AbortSignal.timeout(20000),
          });
          assert.equal(response.ok, true, 'Cannot read the existing Pages project');
          const data = await response.json(); assert.equal(data.success, true);
          const project = data.result;
          assert.equal(project.production_branch, 'main'); assert.ok(project.domains.includes('eidos-works.com'));
          const relay = project.deployment_configs.production.env_vars.EIDOS_PLATFORM_URL;
          let relayOrigin = 'unavailable';
          try { relayOrigin = new URL(relay.value).origin; } catch { /* encrypted binding stays private */ }
          console.log(JSON.stringify({ deployment: project.canonical_deployment.id, siteRevision: project.canonical_deployment.deployment_trigger.metadata.commit_hash,
            relayType: relay?.type, relayOrigin, changed: false }));
          JS
      - name: Publish only a deliberately selected public profile repair on current main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[public-profiles]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          EIDOS_RELEASE_PROBE_ORIGIN: https://eidosworks.pages.dev
        run: |
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$CURRENT_MAIN" = "$GITHUB_SHA"
          node scripts/playground-pages-release.mjs preflight
          npx --no-install wrangler pages deploy dist --project-name=eidosworks --branch=main --commit-hash="$GITHUB_SHA" --commit-message='Verified public profile repair' --commit-dirty=true
          node scripts/playground-pages-release.mjs verify
          PROFILE_ROUTE_BASE=https://eidosworks.pages.dev node scripts/verify-public-profile-route.mjs
